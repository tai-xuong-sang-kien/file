<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Share</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f9;
  color:#1d2433;
}

#app{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.owner-btn{
  position:fixed;
  top:18px;
  left:18px;
  width:48px;
  height:48px;
  border:1px solid #d8dce6;
  border-radius:14px;
  background:#fff;
  font-size:24px;
  cursor:pointer;
  box-shadow:0 4px 18px #00000010;
  z-index:10;
}

.card{
  width:min(92vw,700px);
  background:#fff;
  border:1px solid #e1e5ed;
  border-radius:28px;
  padding:34px 26px;
  box-shadow:0 12px 45px #17223b12;
}

.file-icon{
  text-align:center;
  font-size:64px;
  margin-bottom:12px;
}

.name{
  text-align:center;
  font-size:22px;
  font-weight:700;
  word-break:break-word;
  margin-bottom:18px;
}

.text-box{
  width:100%;
  min-height:250px;
  max-height:500px;
  overflow:auto;
  padding:18px;
  border:1px solid #dfe3eb;
  border-radius:16px;
  background:#f8f9fb;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
  font-size:16px;
  text-align:left;
}

.copy-btn{
  width:100%;
  margin-top:16px;
  padding:17px;
  border:none;
  border-radius:14px;
  background:#151b27;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

.copy-btn:active{
  transform:scale(.97);
}

.empty{
  text-align:center;
  color:#8b93a3;
  padding:30px 10px;
}

.modal-back{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}

.modal-back.show{
  display:flex;
}

.modal{
  width:min(100%,520px);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 20px 60px #0004;
}

.modal h2{
  margin:0 0 18px;
}

.close{
  float:right;
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d8dce6;
  border-radius:12px;
  font-size:16px;
  margin:7px 0;
}

textarea{
  width:100%;
  min-height:260px;
  resize:vertical;
  padding:15px;
  border:1px solid #d8dce6;
  border-radius:14px;
  font-size:16px;
  font-family:Arial,sans-serif;
  line-height:1.5;
  outline:none;
  margin-top:7px;
}

textarea:focus,
input:focus{
  border-color:#151b27;
}

.row{
  display:flex;
  gap:10px;
  margin-top:14px;
  flex-wrap:wrap;
}

.btn{
  padding:13px 17px;
  border-radius:12px;
  border:1px solid #d8dce6;
  background:#fff;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.primary{
  background:#151b27;
  color:#fff;
  border-color:#151b27;
}

.danger{
  background:#e53d3d;
  color:#fff;
  border-color:#e53d3d;
}

.status{
  font-size:14px;
  color:#667085;
  min-height:20px;
  margin-top:10px;
  white-space:pre-wrap;
  word-break:break-word;
}

.counter{
  text-align:right;
  color:#8b93a3;
  font-size:13px;
  margin-top:6px;
}
</style>
</head>

<body>

<button
  class="owner-btn"
  id="ownerBtn"
  title="Đăng nhập chủ"
>
🔧
</button>


<main id="app">

<section class="card">

<div id="textArea">

<div class="empty">
Đang tải văn bản...
</div>

</div>

</section>

</main>


<!-- ĐĂNG NHẬP CHỦ -->

<div
  class="modal-back"
  id="loginModal"
>

<div class="modal">

<button
  class="close"
  data-close="loginModal"
>
×
</button>

<h2>Đăng nhập chủ</h2>

<input
  id="email"
  type="email"
  placeholder="Email"
>

<input
  id="password"
  type="password"
  placeholder="Mật khẩu"
>

<div class="row">

<button
  class="btn primary"
  id="loginBtn"
>
Đăng nhập
</button>

</div>

<div
  class="status"
  id="loginStatus"
></div>

</div>

</div>


<!-- QUẢN TRỊ CHỦ -->

<div
  class="modal-back"
  id="adminModal"
>

<div class="modal">

<button
  class="close"
  data-close="adminModal"
>
×
</button>

<h2>Quản lý văn bản</h2>

<input
  id="textTitle"
  type="text"
  placeholder="Tiêu đề văn bản"
>

<textarea
  id="textInput"
  placeholder="Dán văn bản vào đây..."
></textarea>

<div
  class="counter"
  id="counter"
>
0 ký tự
</div>

<div class="row">

<button
  class="btn primary"
  id="saveBtn"
>
📤 Đăng / thay văn bản
</button>

<button
  class="btn danger"
  id="deleteBtn"
>
🗑 Xóa văn bản
</button>

<button
  class="btn"
  id="logoutBtn"
>
Đăng xuất
</button>

</div>

<div
  class="status"
  id="adminStatus"
></div>

</div>

</div>


<script type="module">

/* ================================
   FIREBASE
================================ */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyDwKjknHn-FoFA9-g2BlHHUGNnN7y8GDdIE",

  authDomain:
    "tai-xuong-sang-kien.firebaseapp.com",

  projectId:
    "tai-xuong-sang-kien",

  storageBucket:
    "tai-xuong-sang-kien.firebasestorage.app",

  messagingSenderId:
    "449492392794",

  appId:
    "1:449492392794:web:53022357bb0575c55a7163"

};


/* ================================
   KHỞI TẠO
================================ */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


const textDoc =
doc(
  db,
  "public",
  "mainText"
);


let current=null;


/* ================================
   HELPER
================================ */

const $ =
id =>
document.getElementById(id);

const show =
id =>
$(id).classList.add("show");

const hide =
id =>
$(id).classList.remove("show");


document
.querySelectorAll("[data-close]")
.forEach(button=>{

button.onclick=()=>{

hide(
button.dataset.close
);

};

});


/* ================================
   ESCAPE
================================ */

function escapeHtml(text){

return String(text)
.replace(
/[&<>"']/g,
char=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[char])
);

}


/* ================================
   HIỂN THỊ
================================ */

function render(){

const area=
$("textArea");


if(!current){

area.innerHTML=`

<div class="empty">
Chưa có văn bản nào.
</div>

`;

return;

}


area.innerHTML=`

<div class="file-icon">
📝
</div>

<div class="name">
${escapeHtml(
current.title || "Văn bản"
)}
</div>

<div
class="text-box"
>${escapeHtml(
current.content
)}</div>

<button
class="copy-btn"
id="copyBtn"
>
📋 Copy văn bản
</button>

`;


/* ================================
   COPY CHO KHÁCH
================================ */

$("copyBtn").onclick=
async()=>{

try{

await navigator.clipboard.writeText(
current.content
);

$("copyBtn").textContent=
"✅ Đã copy!";

}catch(error){

const temp=
document.createElement("textarea");

temp.value=
current.content;

document.body.appendChild(temp);

temp.select();

document.execCommand("copy");

temp.remove();

$("copyBtn").textContent=
"✅ Đã copy!";

}

setTimeout(()=>{

$("copyBtn").textContent=
"📋 Copy văn bản";

},1500);

};

}


/* ================================
   ĐỌC FIRESTORE
================================ */

async function loadText(){

try{

const snapshot=
await getDoc(textDoc);

if(snapshot.exists()){

current=
snapshot.data();

}else{

current=null;

}

render();

}catch(error){

console.error(error);

$("textArea").innerHTML=`

<div class="empty">

❌ Không tải được văn bản.

<br><br>

${escapeHtml(
error.code ||
error.message
)}

</div>

`;

}

}


/* ================================
   NÚT CHỦ
================================ */

$("ownerBtn").onclick=()=>{

if(auth.currentUser){

/*
  Đã đăng nhập
  → mở quản trị
*/

$("textTitle").value=
current?.title || "";

$("textInput").value=
current?.content || "";

updateCounter();

show("adminModal");

}else{

/*
  Khách
  → chỉ hiện đăng nhập
*/

show("loginModal");

}

};


/* ================================
   ĐĂNG NHẬP
================================ */

$("loginBtn").onclick=
async()=>{

const email=
$("email").value.trim();

const password=
$("password").value;


if(!email||!password){

$("loginStatus").textContent=
"❌ Hãy nhập email và mật khẩu.";

return;

}


$("loginStatus").textContent=
"Đang đăng nhập...";


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

hide("loginModal");


$("textTitle").value=
current?.title || "";

$("textInput").value=
current?.content || "";

updateCounter();

show("adminModal");

$("loginStatus").textContent="";

}catch(error){

console.error(error);

$("loginStatus").textContent=
"❌ Đăng nhập thất bại:\n"+
(
error.code ||
error.message
);

}

};


/* ================================
   AUTH
================================ */

onAuthStateChanged(
auth,
user=>{

if(user){

$("ownerBtn").title=
"Quản trị viên đã đăng nhập";

}else{

$("ownerBtn").title=
"Đăng nhập chủ";

}

}
);


/* ================================
   ĐẾM KÝ TỰ
================================ */

function updateCounter(){

$("counter").textContent=
$("textInput").value.length+
" ký tự";

}


$("textInput").addEventListener(
"input",
updateCounter
);


/* ================================
   CHỈ CHỦ ĐƯỢC ĐĂNG
================================ */

$("saveBtn").onclick=
async()=>{

/*
  Kiểm tra đăng nhập trước
*/

if(!auth.currentUser){

$("adminStatus").textContent=
"❌ Bạn không có quyền.";

return;

}


const title=
$("textTitle")
.value
.trim() ||
"Văn bản";


const content=
$("textInput")
.value;


if(!content.trim()){

$("adminStatus").textContent=
"❌ Hãy nhập văn bản.";

return;

}


const button=
$("saveBtn");

button.disabled=true;

$("adminStatus").textContent=
"☁️ Đang lưu...";


try{

const data={

title:title,

content:content,

updatedAt:Date.now(),

updatedBy:
auth.currentUser.uid

};


await setDoc(
textDoc,
data
);


current=data;

render();


$("adminStatus").textContent=
"✅ Đã đăng văn bản.";

}catch(error){

console.error(error);

$("adminStatus").textContent=
"❌ Lỗi:\n"+
(
error.code ||
error.message
);

}


button.disabled=false;

};


/* ================================
   CHỈ CHỦ ĐƯỢC XÓA
================================ */

$("deleteBtn").onclick=
async()=>{

if(!auth.currentUser){

$("adminStatus").textContent=
"❌ Bạn không có quyền.";

return;

}


if(!current){

$("adminStatus").textContent=
"Không có văn bản.";

return;

}


if(
!confirm(
"Bạn chắc chắn muốn xóa văn bản?"
)
){

return;

}


$("adminStatus").textContent=
"Đang xóa...";


try{

await deleteDoc(
textDoc
);

current=null;

render();

$("textTitle").value="";
$("textInput").value="";

updateCounter();

$("adminStatus").textContent=
"✅ Đã xóa.";

}catch(error){

console.error(error);

$("adminStatus").textContent=
"❌ Không thể xóa:\n"+
(
error.code ||
error.message
);

}

};


/* ================================
   ĐĂNG XUẤT
================================ */

$("logoutBtn").onclick=
async()=>{

await signOut(auth);

hide("adminModal");

};


/* ================================
   CHẠY
================================ */

loadText();

</script>

</body>
  </html>
