<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Share</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f9;
  color:#1d2433;
}

#app{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.owner-btn{
  position:fixed;
  top:18px;
  left:18px;
  width:48px;
  height:48px;
  border:1px solid #d8dce6;
  border-radius:14px;
  background:#fff;
  font-size:24px;
  cursor:pointer;
  box-shadow:0 4px 18px #00000010;
  z-index:10;
}

.card{
  width:min(92vw,700px);
  background:#fff;
  border:1px solid #e1e5ed;
  border-radius:28px;
  padding:34px 26px;
  box-shadow:0 12px 45px #17223b12;
}

.file-icon{
  text-align:center;
  font-size:64px;
  margin-bottom:12px;
}

.name{
  text-align:center;
  font-size:22px;
  font-weight:700;
  word-break:break-word;
  margin-bottom:18px;
}

.text-box{
  width:100%;
  min-height:250px;
  max-height:500px;
  overflow:auto;
  padding:18px;
  border:1px solid #dfe3eb;
  border-radius:16px;
  background:#f8f9fb;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
  font-size:16px;
  text-align:left;
}

.copy-btn{
  width:100%;
  margin-top:16px;
  padding:17px;
  border:none;
  border-radius:14px;
  background:#151b27;
  color:#fff;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.copy-btn:active{
  transform:scale(.97);
}

.empty{
  text-align:center;
  color:#8b93a3;
  padding:30px 10px;
}

.modal-back{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:20;
}

.modal-back.show{
  display:flex;
}

.modal{
  width:min(100%,520px);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 20px 60px #0004;
}

.modal h2{
  margin:0 0 18px;
}

.close{
  float:right;
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d8dce6;
  border-radius:12px;
  font-size:16px;
  margin:7px 0;
}

textarea{
  width:100%;
  min-height:260px;
  resize:vertical;
  padding:15px;
  border:1px solid #d8dce6;
  border-radius:14px;
  font-size:16px;
  font-family:Arial,sans-serif;
  line-height:1.5;
  outline:none;
  margin-top:7px;
}

.row{
  display:flex;
  gap:10px;
  margin-top:14px;
  flex-wrap:wrap;
}

.btn{
  padding:13px 17px;
  border-radius:12px;
  border:1px solid #d8dce6;
  background:#fff;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.primary{
  background:#151b27;
  color:#fff;
  border-color:#151b27;
}

.danger{
  background:#e53d3d;
  color:#fff;
  border-color:#e53d3d;
}

.status{
  font-size:14px;
  color:#667085;
  min-height:20px;
  margin-top:10px;
  white-space:pre-wrap;
  word-break:break-word;
}

.counter{
  text-align:right;
  color:#8b93a3;
  font-size:13px;
  margin-top:6px;
}
</style>
</head>

<body>

<button
  class="owner-btn"
  id="ownerBtn"
  title="Đăng nhập chủ"
>🔧</button>

<main id="app">

<section class="card">

<div id="textArea">
  <div class="empty">
    Đang tải văn bản...
  </div>
</div>

</section>

</main>


<!-- =========================
     LOGIN
========================= -->

<div class="modal-back" id="loginModal">

<div class="modal">

<button class="close" data-close="loginModal">×</button>

<h2>Đăng nhập chủ</h2>

<input
  id="email"
  type="email"
  placeholder="Email"
  autocomplete="email"
>

<input
  id="password"
  type="password"
  placeholder="Mật khẩu"
  autocomplete="current-password"
>

<div class="row">

<button
  class="btn primary"
  id="loginBtn"
>
Đăng nhập
</button>

</div>

<div
  class="status"
  id="loginStatus"
></div>

</div>
</div>


<!-- =========================
     ADMIN
========================= -->

<div class="modal-back" id="adminModal">

<div class="modal">

<button class="close" data-close="adminModal">×</button>

<h2>Quản lý văn bản</h2>

<input
  id="textTitle"
  type="text"
  placeholder="Tiêu đề văn bản"
>

<textarea
  id="textInput"
  placeholder="Dán văn bản vào đây..."
></textarea>

<div
  class="counter"
  id="counter"
>
0 ký tự
</div>

<div class="row">

<button
  class="btn primary"
  id="saveBtn"
>
📤 Đăng / thay văn bản
</button>

<button
  class="btn danger"
  id="deleteBtn"
>
🗑 Xóa văn bản
</button>

<button
  class="btn"
  id="logoutBtn"
>
Đăng xuất
</button>

</div>

<div
  class="status"
  id="adminStatus"
></div>

</div>
</div>


<script type="module">

/* ==========================================
   FIREBASE
========================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  setPersistence,
  browserSessionPersistence,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyATRcv49PCkANBb_2l3PbKVnyU_1uQV86Q",

  authDomain:
    "quan-ly-lop-53dab.firebaseapp.com",

  projectId:
    "quan-ly-lop-53dab",

  storageBucket:
    "quan-ly-lop-53dab.firebasestorage.app",

  messagingSenderId:
    "819279256921",

  appId:
    "1:819279256921:web:f09c1e282724b141f14048",

  measurementId:
    "G-LTHGVR1Y7F"

};


/* ==========================================
   KHỞI TẠO
========================================== */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/*
  QUAN TRỌNG:
  Mỗi tab dùng một phiên đăng nhập riêng.
*/

await setPersistence(
  auth,
  browserSessionPersistence
);


/* ==========================================
   FIRESTORE
========================================== */

const textDoc =
  doc(
    db,
    "public",
    "mainText"
  );

let current = null;


/* ==========================================
   HELPER
========================================== */

const $ =
  id => document.getElementById(id);

function show(id){
  $(id).classList.add("show");
}

function hide(id){
  $(id).classList.remove("show");
}


/* ==========================================
   ĐÓNG MODAL
========================================== */

document
.querySelectorAll("[data-close]")
.forEach(button => {

  button.onclick = () => {

    hide(
      button.dataset.close
    );

  };

});


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(text){

  return String(text)
    .replace(
      /[&<>"']/g,
      char => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[char])
    );

}


/* ==========================================
   COUNTER
========================================== */

function updateCounter(){

  $("counter").textContent =
    $("textInput").value.length +
    " ký tự";

}


/* ==========================================
   HIỂN THỊ
========================================== */

function render(){

  const area =
    $("textArea");


  if(!current){

    area.innerHTML = `

      <div class="empty">
        Chưa có văn bản nào.
      </div>

    `;

    return;

  }


  area.innerHTML = `

    <div class="file-icon">
      📝
    </div>

    <div class="name">
      ${escapeHtml(
        current.title ||
        "Văn bản"
      )}
    </div>

    <div class="text-box">
      ${escapeHtml(
        current.content ||
        ""
      )}
    </div>

    <button
      class="copy-btn"
      id="copyBtn"
    >
      📋 Copy văn bản
    </button>

  `;


  $("copyBtn").onclick =
  async () => {

    const content =
      current.content || "";


    try{

      await navigator
        .clipboard
        .writeText(
          content
        );

    }catch(error){

      const temp =
        document.createElement(
          "textarea"
        );

      temp.value =
        content;

      document.body.appendChild(
        temp
      );

      temp.select();

      document.execCommand(
        "copy"
      );

      temp.remove();

    }


    $("copyBtn").textContent =
      "✅ Đã copy!";


    setTimeout(() => {

      if($("copyBtn")){

        $("copyBtn").textContent =
          "📋 Copy văn bản";

      }

    },1500);

  };

}


/* ==========================================
   LOAD FIRESTORE
========================================== */

async function loadText(){

  $("textArea").innerHTML = `

    <div class="empty">
      Đang tải văn bản...
    </div>

  `;


  try{

    const snapshot =
      await getDoc(
        textDoc
      );


    if(snapshot.exists()){

      current =
        snapshot.data();

    }else{

      current = null;

    }


    render();

  }catch(error){

    console.error(
      "Firestore error:",
      error
    );


    $("textArea").innerHTML = `

      <div class="empty">

        ❌ Không tải được văn bản.

        <br><br>

        ${escapeHtml(
          error.code ||
          error.message
        )}

      </div>

    `;

  }

}


/* ==========================================
   NÚT CHỦ
========================================== */

$("ownerBtn").onclick = () => {

  /*
    Chỉ kiểm tra phiên của TAB hiện tại.
  */

  if(auth.currentUser){

    $("textTitle").value =
      current?.title || "";

    $("textInput").value =
      current?.content || "";

    updateCounter();

    $("adminStatus").textContent =
      "";

    show(
      "adminModal"
    );

  }else{

    $("email").value =
      "";

    $("password").value =
      "";

    $("loginStatus").textContent =
      "";

    show(
      "loginModal"
    );

  }

};


/* ==========================================
   LOGIN
========================================== */

$("loginBtn").onclick =
async () => {

  const email =
    $("email")
      .value
      .trim();

  const password =
    $("password")
      .value;


  if(!email){

    $("loginStatus").textContent =
      "❌ Hãy nhập email.";

    return;

  }


  if(!password){

    $("loginStatus").textContent =
      "❌ Hãy nhập mật khẩu.";

    return;

  }


  $("loginBtn").disabled =
    true;

  $("loginStatus").textContent =
    "Đang đăng nhập...";


  try{

    /*
      Vì đã dùng browserSessionPersistence,
      phiên này chỉ thuộc tab hiện tại.
    */

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    $("loginStatus").textContent =
      "✅ Đăng nhập thành công.";

    hide(
      "loginModal"
    );


    $("textTitle").value =
      current?.title || "";

    $("textInput").value =
      current?.content || "";

    updateCounter();


    show(
      "adminModal"
    );


  }catch(error){

    console.error(
      "Login error:",
      error
    );


    let message =
      error.code ||
      error.message;


    if(
      error.code ===
      "auth/api-key-not-valid"
    ){

      message =
        "API Key Firebase không hợp lệ.";

    }

    else if(
      error.code ===
      "auth/invalid-credential"
    ){

      message =
        "Email hoặc mật khẩu không đúng.";

    }

    else if(
      error.code ===
      "auth/user-not-found"
    ){

      message =
        "Không tìm thấy tài khoản.";

    }

    else if(
      error.code ===
      "auth/wrong-password"
    ){

      message =
        "Mật khẩu không đúng.";

    }

    else if(
      error.code ===
      "auth/invalid-email"
    ){

      message =
        "Email không hợp lệ.";

    }

    else if(
      error.code ===
      "auth/too-many-requests"
    ){

      message =
        "Có quá nhiều lần đăng nhập. Hãy thử lại sau.";

    }


    $("loginStatus").textContent =
      "❌ " + message;

  }


  $("loginBtn").disabled =
    false;

};


/* ==========================================
   AUTH STATE
========================================== */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      $("ownerBtn").title =
        "Chủ đang đăng nhập trong tab này";

    }else{

      $("ownerBtn").title =
        "Đăng nhập chủ";

    }

  }
);


/* ==========================================
   INPUT
========================================== */

$("textInput")
.addEventListener(
  "input",
  updateCounter
);


/* ==========================================
   SAVE
========================================== */

$("saveBtn").onclick =
async () => {

  if(!auth.currentUser){

    $("adminStatus").textContent =
      "❌ Bạn chưa đăng nhập.";

    return;

  }


  const title =
    $("textTitle")
      .value
      .trim() ||
    "Văn bản";


  const content =
    $("textInput")
      .value;


  if(!content.trim()){

    $("adminStatus").textContent =
      "❌ Hãy nhập văn bản.";

    return;

  }


  $("saveBtn").disabled =
    true;

  $("adminStatus").textContent =
    "☁️ Đang lưu...";


  try{

    const data = {

      title:
        title,

      content:
        content,

      updatedAt:
        Date.now(),

      updatedBy:
        auth.currentUser.uid

    };


    await setDoc(
      textDoc,
      data
    );


    current =
      data;


    render();


    $("adminStatus").textContent =
      "✅ Đã đăng / thay văn bản.";

  }catch(error){

    console.error(
      "Save error:",
      error
    );


    $("adminStatus").textContent =
      "❌ Không thể lưu:\n" +
      (
        error.code ||
        error.message
      );

  }


  $("saveBtn").disabled =
    false;

};


/* ==========================================
   DELETE
========================================== */

$("deleteBtn").onclick =
async () => {

  if(!auth.currentUser){

    $("adminStatus").textContent =
      "❌ Bạn chưa đăng nhập.";

    return;

  }


  if(!current){

    $("adminStatus").textContent =
      "Không có văn bản để xóa.";

    return;

  }


  if(!confirm(
    "Bạn chắc chắn muốn xóa văn bản?"
  )){

    return;

  }


  $("deleteBtn").disabled =
    true;

  $("adminStatus").textContent =
    "🗑 Đang xóa...";


  try{

    await deleteDoc(
      textDoc
    );


    current =
      null;


    $("textTitle").value =
      "";

    $("textInput").value =
      "";

    updateCounter();

    render();


    $("adminStatus").textContent =
      "✅ Đã xóa văn bản.";

  }catch(error){

    console.error(
      "Delete error:",
      error
    );


    $("adminStatus").textContent =
      "❌ Không thể xóa:\n" +
      (
        error.code ||
        error.message
      );

  }


  $("deleteBtn").disabled =
    false;

};


/* ==========================================
   LOGOUT
========================================== */

$("logoutBtn").onclick =
async () => {

  try{

    await signOut(
      auth
    );

    hide(
      "adminModal"
    );

  }catch(error){

    console.error(
      "Logout error:",
      error
    );

  }

};


/* ==========================================
   START
========================================== */

loadText();

</script>

</body>
  </html>
