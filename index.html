```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>File Share</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f9;
  color:#1d2433
}

#app{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px
}

.owner-btn{
  position:fixed;
  top:18px;
  left:18px;
  width:48px;
  height:48px;
  border:1px solid #d8dce6;
  border-radius:14px;
  background:#fff;
  font-size:24px;
  cursor:pointer;
  box-shadow:0 4px 18px #00000010
}

.card{
  width:min(92vw,650px);
  background:#fff;
  border:1px solid #e1e5ed;
  border-radius:28px;
  padding:34px 26px;
  text-align:center;
  box-shadow:0 12px 45px #17223b12
}

.file-icon{
  font-size:70px;
  margin-bottom:12px
}

.name{
  font-size:22px;
  font-weight:700;
  word-break:break-word
}

.size{
  color:#7b8494;
  margin:10px 0 20px
}

.text-preview{
  width:100%;
  min-height:180px;
  max-height:400px;
  overflow:auto;
  padding:16px;
  border:1px solid #e1e5ed;
  border-radius:14px;
  background:#f8f9fb;
  text-align:left;
  white-space:pre-wrap;
  word-break:break-word;
  margin-bottom:20px
}

.download{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:15px 26px;
  border:0;
  border-radius:14px;
  background:#151b27;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none
}

.empty{
  color:#8b93a3;
  padding:18px
}

.modal-back{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:5
}

.modal-back.show{
  display:flex
}

.modal{
  width:min(100%,440px);
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 20px 60px #0004
}

.modal h2{
  margin:0 0 18px
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d8dce6;
  border-radius:12px;
  font-size:16px;
  margin:7px 0
}

.row{
  display:flex;
  gap:10px;
  margin-top:14px;
  flex-wrap:wrap
}

.btn{
  padding:13px 17px;
  border-radius:12px;
  border:1px solid #d8dce6;
  background:#fff;
  font-weight:700;
  cursor:pointer
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed
}

.primary{
  background:#151b27;
  color:#fff;
  border-color:#151b27
}

.danger{
  background:#e53d3d;
  color:#fff;
  border-color:#e53d3d
}

.status{
  font-size:14px;
  color:#667085;
  min-height:20px;
  margin-top:10px;
  white-space:pre-wrap;
  word-break:break-word
}

.close{
  float:right;
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer
}
</style>
</head>

<body>

<button class="owner-btn" id="ownerBtn">
🔧
</button>

<main id="app">
<section class="card">

<div id="fileArea">
<div class="empty">
Đang tải văn bản...
</div>
</div>

</section>
</main>


<!-- LOGIN -->

<div class="modal-back" id="loginModal">

<div class="modal">

<button class="close" data-close="loginModal">
×
</button>

<h2>Đăng nhập chủ</h2>

<input
id="email"
type="email"
placeholder="Email"
>

<input
id="password"
type="password"
placeholder="Mật khẩu"
>

<div class="row">

<button
class="btn primary"
id="loginBtn"
>
Đăng nhập
</button>

</div>

<div
class="status"
id="loginStatus"
></div>

</div>
</div>


<!-- ADMIN -->

<div class="modal-back" id="adminModal">

<div class="modal">

<button class="close" data-close="adminModal">
×
</button>

<h2>Quản lý văn bản</h2>

<p id="adminFileName">
Chưa có văn bản.
</p>

<input
id="newFile"
type="file"
accept=".txt,text/plain"
>

<div class="row">

<button
class="btn primary"
id="uploadBtn"
>
📤 Tải văn bản
</button>

<button
class="btn danger"
id="deleteBtn"
>
🗑 Xóa
</button>

<button
class="btn"
id="logoutBtn"
>
Đăng xuất
</button>

</div>

<div
class="status"
id="adminStatus"
></div>

</div>
</div>


<script type="module">

/* ==================================
   FIREBASE
================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* ==================================
   CONFIG
================================== */

const firebaseConfig={

apiKey:
"AIzaSyDwKjknHn-FoFA9-g2BlHHUGnN7y8GDdIE",

authDomain:
"tai-xuong-sang-kien.firebaseapp.com",

projectId:
"tai-xuong-sang-kien",

storageBucket:
"tai-xuong-sang-kien.firebasestorage.app",

messagingSenderId:
"449492392794",

appId:
"1:449492392794:web:53022357bb0575c55a7163"

};


const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);

const textDoc=
doc(
db,
"public",
"mainText"
);

let current=null;


/* ==================================
   HELPER
================================== */

const $=
id=>document.getElementById(id);

const show=
id=>$(id).classList.add("show");

const hide=
id=>$(id).classList.remove("show");


document
.querySelectorAll("[data-close]")
.forEach(button=>{

button.onclick=()=>
hide(button.dataset.close);

});


function escapeHtml(text){

return String(text)
.replace(
/[&<>"']/g,

c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c])

);

}


/* ==================================
   HIỂN THỊ
================================== */

function render(){

const area=
$("fileArea");


if(!current){

area.innerHTML=`

<div class="empty">
Hiện chưa có văn bản nào.
</div>

`;

$("adminFileName")
.textContent=
"Chưa có văn bản.";

return;

}


area.innerHTML=`

<div class="file-icon">
📝
</div>

<div class="name">
${escapeHtml(current.name)}
</div>

<div class="size">
${current.size} ký tự
</div>

<div class="text-preview">
${escapeHtml(current.content)}
</div>

<button
class="download"
id="downloadText"
>
⬇ Tải xuống
</button>

`;


$("adminFileName")
.textContent=
current.name;


/* TẢI XUỐNG */

$("downloadText").onclick=()=>{

const blob=
new Blob(
[current.content],
{
type:"text/plain;charset=utf-8"
}
);

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
current.name || "van-ban.txt";

document.body.appendChild(a);

a.click();

a.remove();

URL.revokeObjectURL(url);

};

}


/* ==================================
   LOAD
================================== */

async function loadText(){

try{

const snap=
await getDoc(textDoc);

current=
snap.exists()
?snap.data()
:null;

render();

}catch(error){

console.error(error);

$("fileArea").innerHTML=`

<div class="empty">

❌ Không tải được văn bản.

<br><br>

${escapeHtml(
error.code||
error.message
)}

</div>

`;

}

}


/* ==================================
   OWNER
================================== */

$("ownerBtn").onclick=()=>{

if(auth.currentUser)

show("adminModal");

else

show("loginModal");

};


/* ==================================
   LOGIN
================================== */

$("loginBtn").onclick=
async()=>{

const email=
$("email").value.trim();

const password=
$("password").value;


if(!email||!password){

$("loginStatus")
.textContent=
"❌ Nhập email và mật khẩu.";

return;

}


$("loginStatus")
.textContent=
"Đang đăng nhập...";


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

hide("loginModal");

show("adminModal");

$("loginStatus")
.textContent=
"";

}catch(error){

console.error(error);

$("loginStatus")
.textContent=
"❌ "+
(
error.code||
error.message
);

}

};


/* ==================================
   AUTH
================================== */

onAuthStateChanged(
auth,
user=>{

$("ownerBtn").title=
user
?"Quản trị viên đã đăng nhập"
:"Đăng nhập chủ";

}
);


/* ==================================
   UPLOAD TXT
================================== */

$("uploadBtn").onclick=
async()=>{

const file=
$("newFile").files[0];


if(!file){

$("adminStatus")
.textContent=
"❌ Hãy chọn file .txt.";

return;

}


if(!auth.currentUser){

$("adminStatus")
.textContent=
"❌ Bạn chưa đăng nhập.";

return;

}


/* Chỉ cho TXT */

if(
file.type!=="text/plain" &&
!file.name.toLowerCase().endsWith(".txt")
){

$("adminStatus")
.textContent=
"❌ Chỉ được tải file văn bản .txt.";

return;

}


/* Giới hạn để Firestore lưu an toàn */

if(file.size>900000){

$("adminStatus")
.textContent=
"❌ Văn bản quá lớn. Hãy dùng file dưới khoảng 900 KB.";

return;

}


const button=
$("uploadBtn");

button.disabled=true;

$("adminStatus")
.textContent=
"📖 Đang đọc văn bản...";


try{

const content=
await file.text();


$("adminStatus")
.textContent=
"☁️ Đang lưu vào Firebase...";


const data={

name:file.name,

content:content,

size:content.length,

updatedAt:Date.now(),

uploadedBy:
auth.currentUser.uid

};


await setDoc(
textDoc,
data
);


current=data;

$("newFile").value="";

render();


$("adminStatus")
.textContent=
"✅ Tải văn bản thành công.";


}catch(error){

console.error(
"Firestore upload:",
error
);


$("adminStatus")
.textContent=
"❌ Không tải được:\n"+
(
error.code||
error.message
);

}


button.disabled=false;

};


/* ==================================
   DELETE
================================== */

$("deleteBtn").onclick=
async()=>{

if(!current){

$("adminStatus")
.textContent=
"Không có văn bản để xóa.";

return;

}


if(
!confirm(
"Bạn chắc chắn muốn xóa văn bản này?"
)
)return;


$("adminStatus")
.textContent=
"Đang xóa...";


try{

await deleteDoc(textDoc);

current=null;

render();

$("adminStatus")
.textContent=
"✅ Đã xóa văn bản.";

}catch(error){

console.error(error);

$("adminStatus")
.textContent=
"❌ Không thể xóa:\n"+
(
error.code||
error.message
);

}

};


/* ==================================
   LOGOUT
================================== */

$("logoutBtn").onclick=
async()=>{

await signOut(auth);

hide("adminModal");

};


/* ==================================
   START
================================== */

loadText();

</script>

</body>
</html>
```
